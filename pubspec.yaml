name: tresdcal
description: "Calculadora de precios para impresiones 3D. 100% local, mobile + web."
publish_to: 'none'
version: 0.1.0+2

environment:
  sdk: ^3.12.0

dependencies:
  cupertino_icons: ^1.0.8
  decimal: ^3.0.2
  drift: ^2.34.0
  drift_flutter: ^0.3.0
  file_picker: ^10.3.6
  fl_chart: ^1.2.0
  flutter:
    sdk: flutter
  flutter_riverpod: 3.3.2
  gal: ^2.3.3
  go_router: ^17.4.0
  google_fonts: ^8.2.1
  image_picker: ^1.1.2
  intl: ^0.20.2
  path: ^1.9.0
  path_provider: ^2.1.4
  pdf: ^3.13.0
  printing: ^5.13.2
  purchases_flutter: ^10.4.2
  riverpod_annotation: ^4.0.0
  share_plus: ^12.0.2
  shared_preferences: ^2.3.2
  sqlite3_flutter_libs: ^0.6.0
  url_launcher: ^6.3.2

dev_dependencies:
  build_runner: 2.15.1
  drift_dev: 2.34.0
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  image_picker_platform_interface: ^2.11.0
  riverpod_generator: 4.0.4
  riverpod_lint: 3.1.4

dependency_overrides:
  test: 1.31.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/logo.png
    - assets/images/3dlogo.png
    - assets/fonts/Inter-Bold.ttf
    - assets/fonts/Inter-Medium.ttf
    - assets/fonts/Inter-Regular.ttf
    - assets/fonts/Inter-SemiBold.ttf
    - assets/fonts/JetBrainsMono-Bold.ttf
    - assets/fonts/JetBrainsMono-Medium.ttf
    - assets/fonts/JetBrainsMono-Regular.ttf
    - assets/fonts/JetBrainsMono-SemiBold.ttf
    - assets/fonts/Roboto-Regular.ttf
    - assets/fonts/Roboto-Bold.ttf
