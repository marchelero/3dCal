org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
# Workaround: "Could not close incremental caches" (class-fq-name-to-source.tab)
# en Windows con Kotlin 2.3.x / AGP 9. Desactiva compilacion incremental
# de Kotlin (solo afecta velocidad de rebuild, no el output).
kotlin.incremental=false
# Suprime el warning "source value 8 is obsolete" que emite el plugin
# `printing` (aun compila Java con source/target 1.8). Propiedad oficial
# de AGP para esta situacion.
android.javaCompile.suppressSourceTargetDeprecationWarning=true
